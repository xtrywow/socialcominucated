# Runs the lead finder on GitHub's servers (which have open internet access).
# Edit leads-request.json and push to start a run; results are committed to
# results/ on the branch and uploaded as an artifact.
name: Find leads

on:
  push:
    paths: [leads-request.json]
  workflow_dispatch:

permissions:
  contents: write  # to commit results/ back to the branch

jobs:
  leads:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Run lead finder
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          ARGS=$(python -c "import json,shlex; r=json.load(open('leads-request.json')); a=['--source',r['source'],'--limit',str(r.get('limit',0)),'--min-tier',r.get('min_tier','C'),'--out','output/leads.csv','--categories',*r['categories']]; a+=['--pagespeed'] if r.get('pagespeed') else []; a+=['--require-social'] if r.get('require_social') else []; print(shlex.join(a))")
          eval python -m leadfinder $ARGS
          echo "Top of results:"
          head -n 5 output/leads.csv
      - name: Commit results to the branch
        run: |
          mkdir -p results
          cp output/leads.csv "results/leads-$(date -u +%Y%m%d).csv"
          cp output/leads.csv results/leads-latest.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          git commit -m "Add lead results $(date -u +%Y-%m-%d)" || echo "No changes"
          git pull --rebase origin "$GITHUB_REF_NAME" && git push
      - uses: actions/upload-artifact@v4
        with:
          name: leads
          path: output/leads.csv
